[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-tester"
version = "0.2.0"
description = "GPS Telemetry Simulator & Protocol Validator - load and robustness testing for vehicle-tracking / IoT servers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["gps", "telemetry", "gt06", "teltonika", "tk103", "meitrack", "load-testing", "robustness", "iot", "qa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gps-tester = "gps_tester.cli:main"
gps-tester-mock = "gps_tester.core.mock_server:main"

[tool.setuptools.packages.find]
include = ["gps_tester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
